    @font-face {

      src: url('../fonts/montserrat-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Montserrat'; font-style: normal; font-weight: 600; font-display: swap;
      src: url('../fonts/montserrat-latin-600-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Montserrat'; font-style: normal; font-weight: 700; font-display: swap;
      src: url('../fonts/montserrat-latin-700-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 500; font-display: swap;
      src: url('../fonts/cormorant-garamond-latin-500-italic.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Manrope'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('../fonts/manrope-latin-400-normal.woff2') format('woff2');
    }

    :root {
      --gold: #d4a544;
      --gold-bright: #f0c66e;
      --text: #f5f5f5;
      --text-muted: #a8a8a8;
      --text-dim: #8a8a8a;
      --border: #232323;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: clip; }

    body {
      background: radial-gradient(ellipse 80% 60% at 50% 25%, #161616 0%, #060606 80%);
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Subtle gold grid texture, matches main site */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(212, 165, 68, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 165, 68, 0.05) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 30%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 56px 24px 32px;
      position: relative;
      z-index: 1;
    }

    /* Brand block */
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand .logo {
      width: 110px;
      height: auto;
      margin: 0 auto 18px;
      filter: drop-shadow(0 0 24px rgba(212, 165, 68, 0.35));
      display: block;
    }
    .brand h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      margin: 0 0 8px;
    }
    .brand .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 60%;
      max-width: 240px;
      margin: 12px auto;
    }
    .brand .divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .brand .divider .diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }
    .brand .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--gold);
      margin: 0;
    }

    /* Link list */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(20, 20, 20, 0.6);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: transform 200ms ease, border-color 200ms ease, background 200ms ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .link:hover,
    .link:focus-visible {
      border-color: var(--gold);
      background: rgba(30, 25, 15, 0.7);
      transform: translateY(-1px);
      outline: none;
    }
    .link .icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(212, 165, 68, 0.12);
      color: var(--gold);
    }
    .link .icon svg {
      width: 18px;
      height: 18px;
    }
    .link .label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link .arrow {
      width: 14px;
      height: 14px;
      color: var(--text-dim);
      transition: color 200ms ease, transform 200ms ease;
      flex-shrink: 0;
    }
    .link:hover .arrow {
      color: var(--gold);
      transform: translateX(3px);
    }

    /* Primary "Save contact" — gold filled */
    .link-primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #0a0a0a;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      justify-content: center;
      padding: 18px;
    }
    .link-primary .icon {
      background: rgba(10, 10, 10, 0.15);
      color: #0a0a0a;
    }
    .link-primary:hover,
    .link-primary:focus-visible {
      background: var(--gold-bright);
      border-color: var(--gold-bright);
      transform: translateY(-1px);
    }
    .link-primary .arrow { display: none; }

    /* Section heading between groups */
    .section-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 28px 0 12px;
      padding-left: 4px;
    }

    footer {
      padding: 32px 24px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: 'Montserrat', sans-serif;
      position: relative;
      z-index: 1;
    }
    footer a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
